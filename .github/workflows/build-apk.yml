
name: Build YUNO HEARTBEAT APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unpack project
        run: |
          unzip -q YUNO_HEARTBEAT_source.zip -d extracted
          SETTINGS=$(find extracted -name settings.gradle.kts -print -quit)
          test -n "$SETTINGS"
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace
      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: YUNO-HEARTBEAT-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
