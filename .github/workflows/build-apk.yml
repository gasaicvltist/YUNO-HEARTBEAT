
name: Build YUNO HEARTBEAT APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore deleted source archive
        run: |
          git show df5d356782c6cd3c9f26e662178f7903af25532d:YUNO_HEARTBEAT_source.zip > YUNO_HEARTBEAT_source.zip
          test -s YUNO_HEARTBEAT_source.zip
          unzip -q YUNO_HEARTBEAT_source.zip -d extracted
          SETTINGS=$(find extracted -name settings.gradle.kts -print -quit)
          test -n "$SETTINGS"
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fix widget description resource
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/res/values"
          cat > "$PROJECT_DIR/app/src/main/res/values/widget_description.xml" <<'EOF'
          <resources>
              <string name="widget_description">Neon heart that reacts to music</string>
          </resources>
          EOF
          sed -i 's|android:description="Neon heart that reacts to music"|android:description="@string/widget_description"|' "$PROJECT_DIR/app/src/main/res/xml/heart_widget_info.xml"

      - name: Fix HeartRenderer Kotlin colors
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/com/yuno/heartbeat/HeartRenderer.kt"
          s = p.read_text()

          replacements = [
              ("            color = color\n", "            this.color = color\n", 2),
              ("            color = Color.WHITE\n", "            this.color = Color.WHITE\n", 1),
              ("apply { color = color; alpha =", "apply { this.color = color; alpha =", 1),
          ]

          for old, new, expected in replacements:
              actual = s.count(old)
              if actual != expected:
                  raise SystemExit(f"Expected {expected} occurrences, found {actual}: {old!r}")
              s = s.replace(old, new)

          p.write_text(s)
          print("HeartRenderer.kt: all 4 color assignments fixed")
          PY

      - name: Align Java and Kotlin targets
        run: |
          cat >> "$PROJECT_DIR/app/build.gradle.kts" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YUNO-HEARTBEAT-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
